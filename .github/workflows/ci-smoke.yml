name: CI Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository
        run: |
          test -f README.md
          test -f .github/workflows/ci.yml || true
          echo "GitHub Actions smoke test reached the runner."
