name: CI

on:
  push:
    branches:
      - main
      - recovery-intelligence-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scraper, workers]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt pytest
      - name: Install Playwright browsers
        if: matrix.service == 'scraper'
        working-directory: services/scraper
        run: python -m playwright install --with-deps chromium
      - name: Compile Python
        working-directory: services/${{ matrix.service }}
        run: python -m compileall .
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery
          POSTGRES_DB: recovery_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery -d recovery_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall .
      - name: Initialize test database schema
        env:
          DATABASE_URL: postgresql+asyncpg://recovery:recovery@127.0.0.1:5432/recovery_intelligence
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import asyncio
          from app.db import engine
          from app.models import Base

          async def main() -> None:
              async with engine.begin() as connection:
                  await connection.run_sync(Base.metadata.create_all)

          asyncio.run(main())
          PY
      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://recovery:recovery@127.0.0.1:5432/recovery_intelligence
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
