name: CI

on:
  push:
    branches: [main, recovery-intelligence-v1]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, scraper, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt pytest
      - name: Compile Python
        working-directory: services/${{ matrix.service }}
        run: python -m compileall .
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q
