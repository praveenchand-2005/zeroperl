services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recovery_intelligence
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
